<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paleta de cores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Paleta de cores</h1>
    <div id="tela-de-pintura"></div>
    <h3></h3>
    <p>Clique em uma das cores abaixo para pintar a tela</p>
    <div id="paleta">
        <div id="pincel-azul" class="pincel" style="background-color: blue;"></div>
        <div id="pincel-vermelho" class="pincel" style="background-color: red;"></div>
        <div id="pincel-amarelo" class="pincel" style="background-color: yellow;"></div>
        <div id="pincel-laranja" class="pincel" style="background-color: #ff9500;"></div>
        <div id="pincel-roxo" class="pincel" style="background-color: #b311b5;"></div>
        <div id="pincel-rosa" class="pincel" style="background-color: #f254c0;"></div>
        <div id="pincel-verde" class="pincel" style="background-color: #11eb0e;"></div>
        <div id="pincel-azul-agua" class="pincel" style="background-color: #00ffd9;"></div>
        <div id="pincel-marrom" class="pincel" style="background-color: #a74d23;"></div>
    </div>

<script src="script.js"></script>   
</body>
</html>
